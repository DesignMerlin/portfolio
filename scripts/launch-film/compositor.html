<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch film compositor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  /* The film's frame: 1920×1080, the site's dark paper and type. compose.mjs calls render(t) for each frame */
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0f1115; font-family: "Bricolage Grotesque", system-ui, sans-serif; color: #eceef1; }
  .layer { position: absolute; inset: 0; overflow: hidden; will-change: transform, opacity, filter, clip-path; }
  .layer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .half { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
  .half img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .half.l { left: 0; } .half.r { right: 0; }
  .seam { position: absolute; top: 0; bottom: 0; left: calc(50% - 2px); width: 4px; background: #0f1115; }
  /* Graph paper, as on the doodle wall */
  .paper { position: absolute; inset: 0; background-color: #121419;
    background-image: linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px),
      linear-gradient(rgb(255 255 255 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .06) 1px, transparent 1px);
    background-size: 48px 48px, 48px 48px, 192px 192px, 192px 192px; background-position: -1px -1px; }
  #cursor { position: absolute; width: 34px; height: 40px; transform-origin: 4px 4px; }
  /* Captions: lower left, on a soft scrim so they read over any shot */
  #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: linear-gradient(transparent, rgb(8 9 12 / .72)); opacity: 0; }
  #caption { position: absolute; left: 112px; bottom: 96px; max-width: 1200px; font-weight: 600; font-size: 58px; line-height: 1.08; letter-spacing: -0.03em; color: #fff; text-wrap: balance; opacity: 0; text-shadow: 0 2px 24px rgb(0 0 0 / .35); }
  /* End card */
  #end { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; opacity: 0; }
  #end .name { font-weight: 700; font-size: 156px; letter-spacing: -0.05em; line-height: 1; display: flex; gap: 0; justify-content: center; }
  #end .name span { display: inline-block; white-space: pre; }
  #end .role { margin-top: 26px; font-size: 40px; color: #a0a5b0; font-weight: 500; letter-spacing: -0.02em; }
  #end .url { margin-top: 40px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 34px; color: #a99cff; position: relative; display: inline-block; }
  #end svg.under { position: absolute; left: -16px; right: -16px; top: 100%; width: calc(100% + 32px); height: 40px; overflow: visible; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="open" class="layer">
    <div class="paper"></div>
    <svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0">
      <path id="stroke" d="M 330 640 C 520 400, 700 360, 860 520 S 1120 700, 1290 470 S 1560 330, 1620 520" fill="none" stroke="#ff8a73" stroke-width="30" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
    </svg>
    <svg id="cursor" viewBox="0 0 24 28"><path d="M3 2.5v19.2l4.9-4.6 3 7.1 3.6-1.5-3-7h6.7z" fill="#0b0b0c" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </div>
  <div id="A" class="layer"><img id="Aimg" alt=""></div>
  <div id="B" class="layer"><img id="Bimg" alt=""></div>
  <div id="S" class="layer"><div class="half l"><img id="SL" alt=""></div><div class="half r"><img id="SR" alt=""></div><div class="seam"></div></div>
  <div id="scrim"></div>
  <div id="caption"></div>
  <div id="end">
    <div>
      <div class="name" id="name"></div>
      <div class="role" id="role">Product designer and design engineer · Lagos</div>
      <div class="url" id="url">samuelekwenze.vercel.app
        <svg class="under" viewBox="0 0 600 40" preserveAspectRatio="none"><path id="under" d="M 8 22 C 120 6, 260 34, 380 18 S 560 10, 592 20" fill="none" stroke="#ff8a73" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg>
      </div>
    </div>
  </div>
  <div id="black"></div>
</div>
<script>
  // Motion tokens from the site (lib/motion.ts): the same eases the site uses
  const ease = {
    enter: (k) => 1 - Math.pow(1 - k, 3),
    exit: (k) => k * k * k,
    standard: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
    emphasized: (k) => (k < 0.5 ? 16 * Math.pow(k, 5) : 1 - Math.pow(-2 * k + 2, 5) / 2),
    sine: (k) => -(Math.cos(Math.PI * k) - 1) / 2,
    // A gentle spring's settle, as a curve
    gentle: (k) => 1 - Math.exp(-6.5 * k) * Math.cos(7 * k),
  };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const $ = (id) => document.getElementById(id);
  let EDL = null;
  let PLATES = "";
  let COUNTS = {};
  const NAME = "Samuel Ekwenze";
  $("name").innerHTML = [...NAME].map((c) => `<span>${c}</span>`).join("");

  const src = (plate, t) => {
    const n = COUNTS[plate] || 1;
    const i = clamp(Math.round(t * EDL.FPS), 0, n - 1);
    return `${PLATES}/${plate}/${String(i).padStart(5, "0")}.jpg`;
  };
  const camera = (shot, k) => {
    const c = shot.camera || { from: [1, 0, 0], to: [1, 0, 0] };
    const e = ease.sine(k);
    const s = c.from[0] + (c.to[0] - c.from[0]) * e;
    // Never past the plate's edge: a pan can move at most as far as the zoom leaves room for
    const room = (s - 1) / 2;
    const x = clamp(c.from[1] + (c.to[1] - c.from[1]) * e, -room, room);
    const y = clamp(c.from[2] + (c.to[2] - c.from[2]) * e, -room, room);
    return `translate(${(x * 100).toFixed(3)}%, ${(y * 100).toFixed(3)}%) scale(${s.toFixed(4)})`;
  };
  const shotAt = (t) => EDL.shots.find((s) => t >= s.start && t < s.start + s.dur) || EDL.shots[EDL.shots.length - 1];
  const loads = [];
  const setImg = (el, url) => {
    if (el.getAttribute("src") === url) return;
    el.src = url;
    loads.push(el.decode().catch(() => {}));
  };
  const show = (el, on) => (el.style.visibility = on ? "visible" : "hidden");

  /** Paint one plate-based shot into a layer at film time t */
  function paintShot(layer, img, shot, t) {
    const local = t - shot.start;
    setImg(img, src(shot.plate, shot.from + local));
    img.style.transform = camera(shot, clamp(local / shot.dur));
    show(layer, true);
  }

  window.render = async (t) => {
    loads.length = 0;
    const shot = shotAt(t);
    const local = t - shot.start;
    ["open", "A", "B", "S", "end"].forEach((id) => show($(id), false));
    ["A", "B", "S"].forEach((id) => {
      $(id).style.transform = "";
      $(id).style.filter = "";
      $(id).style.opacity = "1";
      $(id).style.clipPath = "";
    });
    $("black").style.opacity = "0";

    if (shot.kind === "open") {
      // A coral brush stroke draws itself, a cursor arrives at its tail, clicks, and the site opens from that point
      show($("open"), true);
      const draw = ease.enter(clamp((local - 0.3) / 1.6));
      $("stroke").setAttribute("stroke-dashoffset", String(1 - draw));
      const tail = $("stroke").getPointAtLength($("stroke").getTotalLength() * Math.max(0.001, draw));
      const arrive = ease.enter(clamp((local - 1.7) / 0.5));
      const press = local > 2.35 && local < 2.55 ? 0.86 : 1;
      $("cursor").style.opacity = String(arrive);
      $("cursor").style.transform = `translate(${tail.x + 18 - (1 - arrive) * 40}px, ${tail.y + 10 + (1 - arrive) * 30}px) scale(${press})`;
      // From the click, the hero opens out of the cursor's point
      if (local > 2.4) {
        const next = EDL.shots[1];
        paintShot($("A"), $("Aimg"), next, next.start);
        const k = ease.emphasized(clamp((local - 2.4) / 0.6));
        $("A").style.clipPath = `circle(${(k * 2300).toFixed(1)}px at ${tail.x + 18}px ${tail.y + 10}px)`;
      }
    } else if (shot.kind === "split") {
      // Two films side by side, opening from the centre line
      show($("S"), true);
      const [l, r] = shot.plates;
      setImg($("SL"), src(l, shot.from + local));
      setImg($("SR"), src(r, shot.from + local));
      const k = ease.standard(clamp(local / 0.45));
      $("S").style.clipPath = `inset(0 ${(50 - k * 50).toFixed(2)}% 0 ${(50 - k * 50).toFixed(2)}%)`;
      // A slow push on each half
      const s = 1.04 + 0.08 * ease.sine(clamp(local / shot.dur));
      $("SL").style.transform = `scale(${s})`;
      $("SR").style.transform = `scale(${s})`;
      // The previous shot stays underneath while the split opens
      if (local < 0.45) {
        const prev = EDL.shots[EDL.shots.indexOf(shot) - 1];
        paintShot($("A"), $("Aimg"), prev, prev.start + prev.dur - 1 / EDL.FPS);
      }
    } else if (shot.kind === "end") {
      show($("end"), true);
      $("end").style.opacity = "1";
      // Letters settle on the gentle spring, staggered
      [...$("name").children].forEach((el, i) => {
        const k = clamp((local - 0.15 - i * 0.035) / 0.9);
        const e = ease.gentle(k);
        el.style.opacity = String(clamp(k * 3));
        el.style.transform = `translateY(${((1 - e) * 60).toFixed(2)}px)`;
      });
      const role = ease.enter(clamp((local - 0.9) / 0.5));
      $("role").style.opacity = String(role);
      $("role").style.transform = `translateY(${(1 - role) * 16}px)`;
      const url = ease.enter(clamp((local - 1.2) / 0.5));
      $("url").style.opacity = String(url);
      $("url").style.transform = `translateY(${(1 - url) * 16}px)`;
      $("under").setAttribute("stroke-dashoffset", String(1 - ease.enter(clamp((local - 1.6) / 0.9))));
      // The last moment fades to black
      $("black").style.opacity = String(ease.standard(clamp((local - 4.4) / 0.6)));
    } else {
      paintShot($("A"), $("Aimg"), shot, t);
      // Whip pan in: the last shot leaves left, blurred; this one arrives from the right
      if (shot.in === "whip" && local < 0.25) {
        const k = ease.enter(local / 0.25);
        $("A").style.transform = `translateX(${((1 - k) * 34).toFixed(2)}%)`;
        $("A").style.filter = `blur(${((1 - k) * 28).toFixed(1)}px)`;
      }
      const next = EDL.shots[EDL.shots.indexOf(shot) + 1];
      if (next?.in === "whip" && shot.start + shot.dur - t < 0.25) {
        const k = ease.exit(1 - (shot.start + shot.dur - t) / 0.25);
        $("A").style.transform = `translateX(${(-k * 34).toFixed(2)}%)`;
        $("A").style.filter = `blur(${(k * 28).toFixed(1)}px)`;
      }
      // Dissolve out: the next shot fades up over this one
      if (shot.out === "dissolve" && shot.start + shot.dur - t < 0.35) {
        const k = ease.standard(1 - (shot.start + shot.dur - t) / 0.35);
        paintShot($("B"), $("Bimg"), next, next.start);
        $("B").style.opacity = String(k);
      }
      // Zoom out to a point, into black, for the end card
      if (shot.out === "zoomout" && shot.start + shot.dur - t < 0.5) {
        const k = ease.exit(1 - (shot.start + shot.dur - t) / 0.5);
        $("A").style.transform = `scale(${(1 - k * 0.9).toFixed(4)})`;
        $("A").style.opacity = String(1 - k);
      }
    }

    // Captions: rise in (base 280ms, enter), out with the shot (quick 180ms, exit)
    const capShot = [...EDL.shots].reverse().find((s) => s.caption && t >= s.start + (s.captionAt || 0) && t < s.start + (s.captionUntil || s.dur));
    if (capShot) {
      const since = t - capShot.start - (capShot.captionAt || 0);
      const until = capShot.start + (capShot.captionUntil || capShot.dur) - t;
      const kin = ease.enter(clamp(since / 0.28));
      const kout = until < 0.18 ? ease.exit(1 - until / 0.18) : 0;
      $("caption").textContent = capShot.caption;
      // Top of the frame for a shot with its own words at the bottom
      $("caption").style.top = capShot.captionTop ? "40px" : "";
      $("caption").style.bottom = capShot.captionTop ? "auto" : "";
      $("scrim").style.top = capShot.captionTop ? "0" : "";
      $("scrim").style.bottom = capShot.captionTop ? "auto" : "";
      $("scrim").style.background = capShot.captionTop ? "linear-gradient(rgb(8 9 12 / .72), transparent)" : "";
      $("caption").style.opacity = String(kin * (1 - kout));
      $("caption").style.transform = `translateY(${((1 - kin) * 18).toFixed(2)}px)`;
      $("scrim").style.opacity = String(kin * (1 - kout));
    } else {
      $("caption").style.opacity = "0";
      $("scrim").style.opacity = "0";
    }
    await Promise.all(loads);
  };

  window.setup = async (edl, plates, counts) => {
    EDL = edl;
    PLATES = plates;
    COUNTS = counts;
    await document.fonts.ready;
  };
</script>
</body>
</html>
